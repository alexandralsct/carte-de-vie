<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EEE2">
<title>Ma carte de vie (style LIFE)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="life-style.css">
</head>
<body class="variante-life">
<main class="app" id="app">
  <header class="haut">
    <h1>Ma carte de vie</h1>
    <div class="actions">
      <button type="button" class="pilule" id="actu">Actualiser</button>
      <button type="button" class="pilule" id="reglages">Réglages</button>
    </div>
  </header>

  <section id="ecran-reglages" class="ecran" hidden>
    <div class="carte">
      <h2>Connexion</h2>
      <p class="aide">Ta carte est lue depuis ton dépôt privé. La clé reste sur cet appareil et n'est envoyée qu'à GitHub.</p>
      <label class="champ">Dépôt privé
        <input id="repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="identifiant/nom-du-depot">
      </label>
      <label class="champ">Clé d'accès
        <input id="cle" type="password" autocomplete="off" placeholder="github_pat_…">
      </label>
      <div class="rangee">
        <button type="button" class="bouton" id="enregistrer">Enregistrer</button>
        <button type="button" class="pilule" id="retour">Retour</button>
      </div>
      <p class="etat" id="etat-reglages" role="status"></p>
    </div>
  </section>

  <section id="ecran-accueil" class="ecran">
    <p class="etat" id="etat" role="status">Chargement de ta carte…</p>
    <div class="moi-tuile" id="moi" role="button" tabindex="0" aria-label="Moi">
      <b>Moi</b><small id="moi-sous"></small>
    </div>
    <div class="grille" id="espaces"></div>
  </section>

  <section id="ecran-espace" class="ecran" hidden>
    <div class="rangee">
      <button type="button" class="pilule" id="retour-espace">← Ma carte</button>
    </div>
    <h2 id="espace-titre"></h2>
    <p class="aide" id="espace-sous"></p>
    <div class="onglets" id="espace-onglets"></div>
    <div class="carte" id="espace-contenu"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
