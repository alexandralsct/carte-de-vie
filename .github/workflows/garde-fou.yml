# Alerte de fuite : à chaque envoi (et chaque jour), vérifie que ce dépôt public
# ne contient que du code. En cas de problème, le contrôle échoue et GitHub
# envoie un e-mail d'alerte à la propriétaire du dépôt.
name: Garde-fou données personnelles
on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers autorisés seulement
        run: |
          ok='^(\.nojekyll|\.github/workflows/[^/]+\.yml|CLAUDE\.md|README\.md|index\.html|sw\.js|monde\.js|manifest(-test)?\.webmanifest|icon-(192|512|maskable-512)\.png|tests/[^/]+\.mjs|passerelle/[^/]+\.gs)$'
          interdits=$(git ls-files | grep -Ev "$ok" || true)
          if [ -n "$interdits" ]; then echo "::error::Fichiers non autorisés dans le dépôt public :"; echo "$interdits"; exit 1; fi
      - name: Aucun secret
        run: |
          if git grep -nIE 'sk-ant-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[abp]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!.github'; then
            echo "::error::Un secret (clé, jeton) semble présent."; exit 1; fi
      - name: Aucune donnée personnelle évidente
        run: |
          if git grep -nIiE "[A-Z0-9._%+-]+@[A-Z0-9.-]+\.(fr|com|net|org|archi|io)\b" -- . ':!.github' | grep -viE 'noreply|example\.|exemple\.'; then
            echo "::error::Adresse e-mail trouvée."; exit 1; fi
          if git grep -nIE "\bAlexandra\b|\bPMA\b|\bFIV\b" -- . ':!.github'; then
            echo "::error::Prénom ou mention de santé trouvée."; exit 1; fi
      - name: Aucun mot de la liste privée
        # La liste est un secret du dépôt (Settings → Secrets and variables → Actions → MOTS_INTERDITS),
        # mots séparés par | ; elle n'apparaît jamais ici ni dans les journaux. Seuls les fichiers fautifs sont nommés.
        env:
          MOTS: ${{ secrets.MOTS_INTERDITS }}
        run: |
          if [ -z "$MOTS" ]; then echo "::warning::Secret MOTS_INTERDITS absent : contrôle des mots privés non fait."; exit 0; fi
          fautifs=$(git grep -lIiE -- "$MOTS" -- . ':!.github' || true)
          if [ -n "$fautifs" ]; then echo "::error::Mot privé trouvé dans :"; echo "$fautifs"; exit 1; fi
