# Alerte de fuite : à chaque envoi (et chaque jour), vérifie que ce dépôt public
# ne contient que du code. En cas de problème, le contrôle échoue et GitHub
# envoie un e-mail d'alerte à la propriétaire du dépôt.
# Les contrôles eux-mêmes sont dans tests/garde-fou.sh (le même script sert de hook local avant chaque commit).
name: Garde-fou données personnelles
on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers autorisés, secrets, e-mails, mots de la liste privée (mots entiers)
        # La liste est un secret du dépôt (Settings → Secrets and variables → Actions → MOTS_INTERDITS),
        # mots séparés par | ; elle n'apparaît jamais ici ni dans les journaux. Sans elle, le contrôle échoue.
        env:
          MOTS: ${{ secrets.MOTS_INTERDITS }}
        run: bash tests/garde-fou.sh
      - name: Icônes et bibliothèque d'OCR inchangées (empreintes sha256)
        # Une image ou un fichier tiers modifié doit être vérifié puis son empreinte mise à jour ici.
        run: |
          sha256sum -c --strict <<'FIN'
          a16b74cce22aebabf830478fa637ca639bfa54f483e91c71aea712e1de8dec16  icon-192.png
          dfdccc731a61f99d7c747e05d5aba640424d8ee32132ed04fe2a5c8d55edc7da  icon-512.png
          5b1c6d0e3c82bf1fd07c8fd504b016b146c37693ab7260446d28be12a02ade4d  icon-maskable-512.png
          a8e29918d098b2b06e1012bdaeffb4aec0445c5d5654709023e0bd1f442a80e8  vendor/tesseract/tesseract.min.js
          aca1229639fc9907d86f96e825955a2b7c5716d17f3bc3acd71f9c7ab66181fc  vendor/tesseract/worker.min.js
          8f04aa0cc81e7bde33f80e92fa01a7a665f0b4884d098acf5de9c7104a11dfaa  vendor/tesseract/core/tesseract-core-lstm.wasm.js
          ce20eda9533cbed1e6c2b4276fbae1e0adc61b6754b5513084be601787b457cf  vendor/tesseract/core/tesseract-core-simd-lstm.wasm.js
          d611139672b3752c7097e671e4a1d9209dfd37f2aeb081ef6487fba3351e9255  vendor/tesseract/lang/fra.traineddata.gz
          c6596eb7be8581c18be736c846fb9173b69eccf6ef94c5135893ec56bd92ba08  vendor/tesseract/LICENSE
          FIN
  historique:
    # Chaque jour : tout l'historique public (lignes ajoutées et messages de commit) pour les secrets et les mots privés.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historique complet
        env:
          MOTS: ${{ secrets.MOTS_INTERDITS }}
          # premier commit du dépôt (version 155), déjà connu : il contient d'anciens mots retirés depuis ;
          # l'historique public ne se réécrit qu'avec l'accord de la propriétaire.
          HISTO_CONNUS: "cd47f08"
        run: bash tests/garde-fou.sh --historique
